name: grobid

services:
  grobid-gpu:
    image: grobid/grobid:0.8.1
    ports:
      - "8070:8070"
    cpus: 0.000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]
              device_ids: ["0"]
    restart: unless-stopped

networks:
  default:
    name: grobid