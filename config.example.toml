[server]
database_url = "sqlite:///./data/app.db"
logging_level = "INFO"
init_user = "admin@example.com"
init_password = "password"

[server.network]
service_host_ip = "127.0.0.1"
service_host_port = 8000
proxy = "http://127.0.0.1:7890"


[retriever.embedding]
model = "BAAI/bge-m3"
save_local = true
fp16 = true
normalize = true
device = "cuda"

[retriever.reranker]
model = "BAAI/bge-reranker-v2-m3"
save_local = true
fp16 = true
normalize = true
device = "cuda"

[retriever.knowledge_base]
vector_db_file = "./data/knowledge_base/vector.db"
doc_db_file = "./data/knowledge_base/document.db"

[llm.openai]
use_proxy = true
api_key = ""

[llm.zhipu]
use_proxy = false
base_url = "https://open.bigmodel.cn/api/paas/v4/"
api_key = ""