[base]
database_url = "postgresql://root:123456@127.0.0.1:5432/llm_chat"
temp_dir = "./temp/"

[auth]
init_user = "admin@example.com"
init_password = "password"
algorithm = "HS256"
access_token_expire_minutes = 1440

[log]
logging_level = "INFO"

[network]
service_host_ip = "127.0.0.1"
service_host_port = 8000
use_proxy = true
proxy = "http://127.0.0.1:7890"

[fileloader.grobid]
grobid_server = "http://localhost:8070"
service = "processFulltextDocument"
batch_size = 100
sleep_time = 5
timeout = 300
coordinates = ["persName", "ref", "head", "s", "p", "title"]
multi_process = 10

[retriever.embedding]
model = "BAAI/bge-m3"
save_local = true
fp16 = true
normalize = true
device = "cuda"

[retriever.reranker]
model = "BAAI/bge-reranker-v2-m3"
save_local = true
fp16 = true
normalize = true
device = "cuda"

[knowledge_base]
store_path = "./data/knowledge_base"
doc_url = "postgresql://root:123456@127.0.0.1:5432/documents"

[knowledge_base.milvus]
uri = "http://127.0.0.1:19530"
username = ""
password = ""
token = ""
secure = false

[knowledge_base.nebula]
host = 'localhost'
port = 9669
username = "root"
password = "nebula"

[llm.openai]
use_proxy = true
api_key = ""

[llm.zhipu]
use_proxy = false
base_url = "https://open.bigmodel.cn/api/paas/v4/"
api_key = ""

[llm.deepseek]
use_proxy = false
base_url = "https://api.deepseek.com/v1"
api_key = ""

[tool.search]
serper_api = ""

[tool.jina]
jina_api = ""
use_local_model = true
model = "jinaai/ReaderLM-v2"
save_local = true
fp16 = false
device = "cuda"